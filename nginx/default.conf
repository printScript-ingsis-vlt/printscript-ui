server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Usado por docker localmente y por la definicion de servicios de Swarm
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Guarda los archivos estáticos en el cache
    location ~* \.(?:css|js|mjs|map|ico|svg|png|jpg|jpeg|gif|webp|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Si no existe un archivo de la /papapa que se haya intenta acceder, a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
